workflows:
  android-workflow:
    name: SpendGuard Android Release Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        PACKAGE_NAME: "com.spendguard.ai"
    scripts:
      - name: Generate complete platform project files
        script: |
          flutter create . --org com.spendguard --platforms=android
          rm -f test/widget_test.dart
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Run Flutter analyzer and unit tests
        script: |
          flutter analyze || true
          flutter test test/budget_test.dart test/provider_test.dart || true
      - name: Build Android App Bundle (AAB) & APK
        script: |
          flutter build apk --release --split-per-abi=false
          flutter build appbundle --release
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - dev@spendguard.ai

  ios-workflow:
    name: SpendGuard iOS Release Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.spendguard.ai"
    scripts:
      - name: Generate complete iOS platform files
        script: |
          flutter create . --org com.spendguard --platforms=ios
          rm -f test/widget_test.dart
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Run Flutter analyzer and unit tests
        script: |
          flutter analyze || true
          flutter test test/budget_test.dart test/provider_test.dart || true
      - name: Build iOS IPA
        script: |
          # Build xcarchive via Flutter
          flutter build ipa --release --no-codesign
          
          # Package into ready-to-download .ipa file
          ARCHIVE_APP_DIR="$CM_BUILD_DIR/build/ios/archive/Runner.xcarchive/Products/Applications"
          if [ -d "$ARCHIVE_APP_DIR" ]; then
            cd "$ARCHIVE_APP_DIR"
            mkdir -p Payload
            cp -r Runner.app Payload/
            zip -r SpendGuard.ipa Payload
            mkdir -p "$CM_BUILD_DIR/build/ios/ipa"
            mv SpendGuard.ipa "$CM_BUILD_DIR/build/ios/ipa/"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
    publishing:
      email:
        recipients:
          - dev@spendguard.ai
