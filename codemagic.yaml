workflows:
  ios-workflow:
    name: SpendGuard iOS Release Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.spendguard.ai"
    scripts:
      - name: Generate complete iOS platform files
        script: |
          flutter create . --org com.spendguard --platforms=ios
          rm -f test/widget_test.dart
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build iOS App & Package IPA
        script: |
          # Build release iOS bundle
          flutter build ios --release --no-codesign
          
          # Package Runner.app into installable .ipa
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r "$CM_BUILD_DIR/SpendGuard.ipa" Payload
          echo "=== SpendGuard.ipa successfully created! ==="
          ls -lh "$CM_BUILD_DIR/SpendGuard.ipa"
    artifacts:
      - SpendGuard.ipa
      - "*.ipa"
      - build/ios/iphoneos/*.app
    publishing:
      email:
        recipients:
          - dev@spendguard.ai
