workflows:
  ios-workflow:
    name: SpendGuard iOS Release Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.spendguard.ai"
    scripts:
      - name: Generate complete iOS platform files
        script: |
          flutter create . --org com.spendguard --platforms=ios
          rm -f test/widget_test.dart
      - name: Configure iOS Sideloading Metadata
        script: |
          PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.spendguard.ai" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.spendguard.ai" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName SpendGuard" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleName string SpendGuard" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName SpendGuard" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string SpendGuard" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable Runner" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string Runner" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundlePackageType APPL" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 14.0" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 14.0" "$PLIST"
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build and Package Direct Sideload IPA
        script: |
          # 1. Build release iOS bundle
          flutter build ios --release --no-codesign
          
          # 2. Package standard Payload structure (Must be Runner.app inside Payload)
          cd build/ios/iphoneos
          rm -rf Payload SpendGuard.ipa
          mkdir -p Payload
          cp -R Runner.app Payload/Runner.app
          
          # 3. Zip Payload properly using standard flags
          zip -qry9 SpendGuard.ipa Payload
          cp SpendGuard.ipa "$CM_BUILD_DIR/SpendGuard.ipa"
          
          echo "=== SpendGuard.ipa Successfully Packaged! ==="
          ls -lh "$CM_BUILD_DIR/SpendGuard.ipa"
    artifacts:
      - SpendGuard.ipa
      - "*.ipa"
      - build/ios/iphoneos/*.app
    publishing:
      email:
        recipients:
          - dev@spendguard.ai
