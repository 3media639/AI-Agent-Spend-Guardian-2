workflows:
  ios-workflow:
    name: SpendGuard iOS Release Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.spendguard.ai"
    scripts:
      - name: Generate complete iOS platform files
        script: |
          flutter create . --org com.spendguard --platforms=ios
          rm -f test/widget_test.dart
      - name: Configure iOS Info.plist for Sideloading
        script: |
          PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.spendguard.ai" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.spendguard.ai" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleName string SpendGuard" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :CFBundleName SpendGuard" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string SpendGuard" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName SpendGuard" "$PLIST"
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build iOS App & Package Valid IPA
        script: |
          # 1. Build release iOS bundle
          flutter build ios --release --no-codesign
          
          # 2. Package standard Payload structure for Scarlet / Sideloadly / AltStore
          cd build/ios/iphoneos
          rm -rf Payload SpendGuard.ipa
          mkdir -p Payload
          cp -r Runner.app Payload/SpendGuard.app
          
          # 3. Create zip with exact standard zip format (no extra parent directories)
          zip -qr9 SpendGuard.ipa Payload
          cp SpendGuard.ipa "$CM_BUILD_DIR/SpendGuard.ipa"
          
          echo "=== Verified Installable SpendGuard.ipa Created! ==="
          ls -lh "$CM_BUILD_DIR/SpendGuard.ipa"
    artifacts:
      - SpendGuard.ipa
      - "*.ipa"
      - build/ios/iphoneos/*.app
    publishing:
      email:
        recipients:
          - dev@spendguard.ai
