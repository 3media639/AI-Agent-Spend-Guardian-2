name: spendguard
description: "AI Agent Spend Guardian - Real-time spend tracking, budgeting, and emergency freeze for AI tools."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Navigation
  go_router: ^14.0.1
  
  # Backend & Database
  supabase_flutter: ^2.5.6
  
  # Secure Storage & Cryptography
  flutter_secure_storage: ^9.0.0
  encrypt: ^5.0.3
  
  # Push Notifications
  firebase_core: ^2.30.1
  firebase_messaging: ^14.8.2
  
  # UI & Visualizations
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  lucide_icons: ^0.257.0
  percent_indicator: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
